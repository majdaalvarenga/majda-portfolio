<svg viewBox="0 0 720 620" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F3EFE7"/>
      <stop offset="100%" stop-color="#E4DBCB"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="720" height="620" rx="24" fill="url(#bgGrad)"/>

  <!-- linha de fluxo conectando os blocos, ecoando problema -> solução -> experiência -->
  <path d="M90 480 C 220 420, 260 300, 360 260 C 460 220, 500 140, 620 110"
        fill="none" stroke="#B85C38" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>

  <!-- bloco 1: quadro kanban (levantamento / requisitos) -->
  <g>
    <rect x="60" y="420" width="150" height="120" rx="10" fill="#FBF9F5" stroke="#A9A199"/>
    <rect x="78" y="440" width="114" height="14" rx="3" fill="#57524C"/>
    <rect x="78" y="464" width="80" height="10" rx="3" fill="#A9A199"/>
    <rect x="78" y="486" width="114" height="10" rx="3" fill="#E4DBCB"/>
    <rect x="78" y="506" width="60" height="10" rx="3" fill="#E4DBCB"/>
  </g>

  <!-- bloco 2: protótipo / wireframe -->
  <g>
    <rect x="300" y="230" width="170" height="130" rx="10" fill="#FBF9F5" stroke="#A9A199"/>
    <rect x="316" y="248" width="138" height="34" rx="6" fill="#E4DBCB"/>
    <circle cx="334" cy="265" r="7" fill="#B85C38"/>
    <rect x="350" y="259" width="88" height="10" rx="3" fill="#A9A199"/>
    <rect x="316" y="294" width="60" height="46" rx="6" fill="#E4DBCB"/>
    <rect x="384" y="294" width="70" height="46" rx="6" fill="#E4DBCB"/>
  </g>

  <!-- bloco 3: user story / checklist -->
  <g>
    <rect x="500" y="60" width="160" height="130" rx="10" fill="#FBF9F5" stroke="#A9A199"/>
    <path d="M517 90 l8 8 l16 -16" fill="none" stroke="#B85C38" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="552" y="86" width="92" height="10" rx="3" fill="#57524C"/>
    <path d="M517 118 l8 8 l16 -16" fill="none" stroke="#B85C38" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="552" y="114" width="70" height="10" rx="3" fill="#A9A199"/>
    <path d="M517 146 l8 8 l16 -16" fill="none" stroke="#B85C38" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="552" y="142" width="80" height="10" rx="3" fill="#A9A199"/>
  </g>

  <!-- pontos de conexão -->
  <circle cx="90" cy="480" r="6" fill="#1E1B18"/>
  <circle cx="360" cy="260" r="6" fill="#1E1B18"/>
  <circle cx="620" cy="110" r="6" fill="#1E1B18"/>
</svg>
